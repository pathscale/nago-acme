name: Publish crate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1
        with:
          toolchain: stable
      # The registry is the only authority on what is already released.
      - id: version
        name: Check crates.io for this version
        run: |
          set -eu
          name=$(cargo read-manifest | jq -er '.name')
          version=$(cargo read-manifest | jq -er '.version')
          if cargo info --registry crates-io "$name@$version" >/dev/null 2>&1; then
            echo "$name $version is already on crates.io, nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io, publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: cargo test --release --all-features
      - name: Publish to crates.io
        if: steps.version.outputs.changed == 'true'
        run: cargo publish --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
